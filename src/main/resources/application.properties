spring.application.name=TestWise AI
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/testwisedb;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
testwise.ai.api-url=${AI_API_URL:}
testwise.ai.api-key=${AI_API_KEY:}
testwise.ai.model=${AI_MODEL:gpt-4o-mini}
